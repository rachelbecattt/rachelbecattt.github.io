<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rachel's Space</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="navbar">
        <a href="#">HOMEPAGE</a>
        <a href="bio.html">BIO</a>
        <a href="more.html">MORE</a>
    </div>
    <div class="title">Rachel's Space</div>
    <div class="image-container">
        <img src="Images/rachelbecattt.github.jpg" alt="Image 1" onclick="showPopup('Image 1', 'A wild imagination of space.')" class="left-image">
        <img src="Images/Image Dark.jpg" alt="Image 2" onclick="showPopup('Image 2', 'A replica of How I See the Space.')" class="right-image">
    </div>
    <div class="popup" id="popup">
        <h2 id="popup-title"></h2>
        <p id="popup-description"></p>
        <div class="planet-section">
            <p>Direct me to this planet:</p>
            <a href="https://jennhsin-work.github.io/Planet.html" target="_blank">
                <img src="Images/Spaceship.png" alt="Spaceship Button" class="planet-button">
            </a>
        </div>
        <button onclick="closePopup()">Close</button>
     </div>
    <div class="overlay" id="overlay" onclick="closePopup()">
    </div>
</div>
    <div class="question-section">
        <h2>Ask me a question</h2>
        <input type="text" placeholder="Type your question here...">
        <button>Submit</button>
    </div>
    <a href="http://jennhsin-work.github.io//" target="_blank">
        <button class ="portal-button"></button>
    </a>

    <script>
        function showPopup(title, description) {
            document.getElementById('popup-title').innerText = title;
            document.getElementById('popup-description').innerText = description;
            document.getElementById('popup').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        }
        function closePopup() {
            document.getElementById('popup').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }
    </script>
</body>
</html>
